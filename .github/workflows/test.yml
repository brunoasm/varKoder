name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run already in flight for it pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # The runner has no GPU, and the default PyPI wheels bundle CUDA (~2.5 GB).
      # Both torch and torchvision must come from the same index, or pip pairs a
      # CPU torch with a CUDA torchvision and importing fastai fails with
      # "operator torchvision::nms does not exist".
      - name: Install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install varKoder with test dependencies
        run: pip install -e '.[test]'

      - name: Run test suite
        run: pytest -v

      - name: Run training smoke tests (slow, no external tools needed)
        run: pytest -v -m slow tests/test_train_smoke.py
