name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install varKoder with test dependencies
        run: pip install -e '.[test]'

      - name: Run test suite
        run: pytest -v

      - name: Run training smoke tests (slow, no external tools needed)
        run: pytest -v -m slow tests/test_train_smoke.py
